context:
  name: fio
  version: "3.43"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/axboe/${{ name }}/archive/refs/tags/${{ name }}-${{ version }}.tar.gz
  sha256: efa49b3f36eda9adf29294f27a87d7e457747d676cd0f73996d6365357832cfe

build:
  skip:
    - win
  script:
    - ./configure --prefix="${PREFIX}"
    - make install
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - pkg-config
  host:
    - zlib
    - libcurl
    - openssl
    - if: linux
      then:
        - libnuma
        # gnutls: required by configure for libnfs >= 6.0, but unused at runtime (no TLS in this libnfs build)
        - gnutls
        - libnfs
        - libaio
tests:
  - script:
      - fio --version

about:
  homepage: https://github.com/axboe/fio
  summary: 'Flexible I/O Tester'
  description: |
    Flexible I/O Tester
  license: GPL-2.0-only
  license_file: COPYING
  documentation: https://fio.readthedocs.io/
  repository: https://github.com/axboe/fio
extra:
  recipe-maintainers:
    - ChristianRothQC
